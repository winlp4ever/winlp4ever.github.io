name: Build

# npm run build is the gate for every change (AGENTS.md); run it on pull
# requests so a broken post can't reach main and fail the deploy.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
