name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed posts to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # GitHub Pages caches pages for up to 10 minutes; wait so crawlers fetch the new version
          sleep 600
          # a manual run has no previous commit: submit every published post
          if [ "${{ github.event_name }}" != "push" ]; then node scripts/indexnow.mjs --all; exit 0; fi
          git fetch --depth=1 origin "$BEFORE" 2>/dev/null || BEFORE=HEAD~1
          # -z and quotePath=false keep names with spaces or accents intact; --no-renames reports a rename as delete + add
          git -c core.quotePath=false diff -z --no-renames --name-only "$BEFORE" HEAD | xargs -0 node scripts/indexnow.mjs
